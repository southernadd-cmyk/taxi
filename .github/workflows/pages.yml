name: Test and publish Switch Cab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switchcab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: |
          for test in tests/{switch-input,speech-wait,recorded-voice,practice,visual-access,navigation,editor,editor-flow,dare,quick-route,advanced-practice}.cjs; do node "$test" || exit 1; done
          for script in js/*.js; do node --check "$script" || exit 1; done
  # Full real-browser acceptance remains available on demand. It is not a
  # publication gate: software WebGL timing has blocked already-tested fixes.
  browser:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: switchcab-playwright-shell-1.51.1-${{ runner.os }}-${{ runner.arch }}
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install chromium --only-shell
          node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})' || npx playwright install-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 > /tmp/switchcab-http.log 2>&1 &
          node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: browser-smoke.png
          if-no-files-found: ignore
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg js assets CREDITS.md LICENSE.txt _site/
          test -s _site/favicon.svg
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
