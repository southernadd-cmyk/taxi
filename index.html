<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Switch Cab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #1d1238;
        --deep: #140c2a;
        --panel: #2d2152;
        --pink: #ff4fa3;
        --teal: #2ad1c9;
        --sun: #ffd23f;
        --ink: #ffffff;
        --money: #7dffa1;
        --s: 1;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-ui="1"] {
        --s: 1.3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --night: #1d1238;
          --ink: #ffffff;
        }
      }
      :root[data-theme="dark"] {
        --night: #1d1238;
        --ink: #ffffff;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--deep);
        color: var(--ink);
        font-family: "Nunito", system-ui, sans-serif;
      }
      canvas#c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #noGL {
        display: grid;
        position: fixed;
        inset: 0;
        place-items: center;
        font-size: 32px;
        font-weight: 900;
        text-align: center;
        padding: 20px;
      }
      .hide {
        display: none !important;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        top: env(safe-area-inset-top, 0px);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 14px;
        pointer-events: none;
        gap: 14px;
      }
      #mission {
        background: rgba(10, 6, 24, 0.9);
        border: 4px solid var(--teal);
        padding: 12px 20px;
        border-radius: 18px;
        font-size: calc(30px * var(--s));
        font-weight: 900;
        max-width: min(60vw, 30ch);
        line-height: 1.15;
      }
      #mission small {
        display: block;
        font-size: 0.62em;
        color: var(--teal);
      }
      #combo {
        font-family: "Bungee", Impact, sans-serif;
        font-size: calc(34px * var(--s));
        color: var(--sun);
        text-shadow: 3px 3px 0 #000;
        margin-top: 8px;
        min-height: 1em;
      }
      #right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      #cash {
        font-family: "Bungee", Impact, sans-serif;
        font-size: calc(46px * var(--s));
        color: var(--money);
        text-shadow:
          4px 4px 0 #0b3b1f,
          0 0 3px #000;
      }
      #stars {
        font-size: calc(40px * var(--s));
        color: var(--sun);
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 #000;
        min-height: 1.1em;
      }
      #mm {
        width: calc(220px * var(--s));
        height: calc(220px * var(--s));
        border-radius: 50%;
        border: 6px solid var(--ink);
        background: #251a45;
        box-shadow: 0 0 0 5px var(--pink);
      }
      #banner {
        position: fixed;
        left: 0;
        right: 0;
        top: 24%;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #banner.show {
        opacity: 1;
      }
      #banner b {
        display: block;
        font-family: "Bungee", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(56px, 10vw, 130px);
        color: var(--sun);
        text-shadow:
          5px 5px 0 var(--pink),
          10px 10px 0 #000;
        line-height: 1;
      }
      #banner span {
        display: inline-block;
        margin-top: 14px;
        font-size: calc(36px * var(--s));
        font-weight: 900;
        background: rgba(10, 6, 24, 0.92);
        padding: 10px 24px;
        border-radius: 14px;
      }
      #focus {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--barH, 0px) + 18px);
        font-family: "Bungee", Impact, sans-serif;
        font-size: calc(64px * var(--s));
        color: var(--night);
        background: var(--sun);
        padding: 10px 34px;
        border-radius: 24px;
        border: 7px solid #fff;
        box-shadow:
          0 0 0 7px var(--pink),
          0 12px 30px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
        pointer-events: none;
        max-width: 96vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #focus.braked {
        box-shadow: none;
        outline: 8px dotted var(--pink);
        outline-offset: 6px;
      }
      #status {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        z-index: 20;
        background: #fff;
        color: var(--night);
        font-weight: 900;
        font-size: calc(32px * var(--s));
        padding: 12px 28px;
        border-radius: 999px;
        border: 6px solid var(--pink);
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
        background: rgba(10, 6, 24, 0.96);
        border-top: 6px solid var(--pink);
      }
      #opts {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .hint {
        font-size: calc(22px * var(--s));
        font-weight: 900;
        color: #e6dcff;
        text-align: center;
        margin-bottom: 10px;
      }
      .opt {
        flex: 1 1 180px;
        min-height: calc(100px * var(--s));
        font:
          900 calc(32px * var(--s)) / 1.1 "Nunito",
          sans-serif;
        color: var(--ink);
        background: var(--panel);
        border: 5px solid #5a4b8f;
        border-radius: 22px;
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: left;
      }
      .opt.on {
        background: var(--sun);
        color: var(--night);
        border: 8px solid #fff;
        box-shadow: 0 0 0 7px var(--pink);
      }
      .opt.on.braked {
        box-shadow: none;
        outline: 8px dotted var(--pink);
        outline-offset: 5px;
      }
      .backstop {
        outline: 8px dashed #ffd23f;
        outline-offset: 6px;
        border-radius: 24px;
      }
      .ar {
        display: inline-block;
        font-size: 1.15em;
      }
      .tag {
        font-size: 0.6em;
        background: var(--teal);
        color: var(--night);
        padding: 4px 10px;
        border-radius: 10px;
        white-space: nowrap;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(
          180deg,
          rgba(20, 10, 44, 0.25) 0%,
          rgba(10, 6, 24, 0.55) 45%,
          rgba(10, 6, 24, 0.88) 100%
        );
        padding: 20px;
        overflow: auto;
      }
      #menuTitle {
        font-family: "Bungee", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(52px, 9vw, 120px);
        line-height: 0.95;
        margin: 10px 0 0;
        color: var(--pink);
        text-shadow:
          6px 6px 0 var(--teal),
          12px 12px 0 #000;
        text-align: center;
      }
      #menuSub {
        font-size: calc(30px * var(--s));
        font-weight: 900;
        margin: 12px 0 18px;
        text-align: center;
        max-width: 40ch;
        white-space: pre-line;
      }
      #menuList {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(560px, 92vw), 1fr));
        gap: 14px;
        width: min(1180px, 94vw);
      }
      #menuList .opt {
        min-height: calc(96px * var(--s));
        justify-content: flex-start;
        padding-left: 28px;
      }
      #menu .hint {
        margin-top: 16px;
      }
      #share {
        position: fixed;
        inset: 10% 8%;
        background: #fff;
        color: #111;
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 22px;
        z-index: 30;
      }
      #share textarea {
        flex: 1;
        font: 16px monospace;
      }
      #share button {
        font:
          900 24px Nunito,
          sans-serif;
        padding: 14px;
        border-radius: 12px;
        border: 3px solid #111;
        background: #ffd23f;
        cursor: pointer;
      }
      @media (max-width: 700px) {
        #mm {
          width: 130px;
          height: 130px;
        }
        .opt {
          flex-basis: 40%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #banner {
          transition: none;
        }
      }

      /* ---------- HUD v2 ---------- */
      #combo:empty {
        display: none;
      }
      #hud {
        padding: 16px;
      }
      #hud > div:first-child {
        background: rgba(12, 8, 30, 0.74);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        padding: 12px 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        max-width: min(48vw, 560px);
      }
      #mission {
        background: none;
        border: none;
        padding: 0;
        max-width: none;
        font-size: calc(26px * var(--s));
      }
      #modeName {
        display: flex !important;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        font-size: calc(19px * var(--s)) !important;
        color: #fff !important;
      }
      .chip {
        background: #2d2152;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 4px 12px;
        font-weight: 900;
        white-space: nowrap;
      }
      .chip.lv {
        background: var(--pink);
        border-color: #fff;
        font-family: "Bungee", Impact, sans-serif;
        font-weight: 400;
      }
      .chip.money {
        background: #0f3b24;
        color: var(--money);
      }
      .chip.ghost {
        background: transparent;
      }
      .strikes {
        display: flex;
        gap: 4px;
      }
      .strike {
        font-style: normal;
        width: 1.6em;
        height: 1.6em;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.35);
        color: transparent;
        font-weight: 900;
      }
      .strike.on {
        background: #e8261b;
        border-color: #fff;
        color: #fff;
      }
      .fuel {
        position: relative;
        width: calc(120px * var(--s));
        height: 1.7em;
        border-radius: 999px;
        background: #1a1430;
        border: 2px solid rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .fuel > span {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(90deg, #2ad1c9, #7dffa1);
      }
      .fuel > span.low {
        background: linear-gradient(90deg, #e8261b, #ff8a3c);
      }
      .fuel em {
        position: relative;
        font-style: normal;
        font-weight: 900;
        padding-left: 10px;
        line-height: 1.7em;
        text-shadow: 0 1px 2px #000;
      }
      .seat {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        padding: 8px 10px;
        margin-top: 8px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.07);
        border-left: 8px solid var(--teal);
      }
      .seat b {
        font-size: 1.05em;
      }
      .seat .num {
        width: 1.5em;
        height: 1.5em;
        border-radius: 50%;
        background: #fff;
        color: var(--night);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 0.85em;
      }
      .seat.warn {
        border-left-color: var(--sun);
      }
      .seat.bad {
        border-left-color: #e8261b;
        background: rgba(232, 38, 27, 0.22);
        animation: hurry 1s steps(2) infinite;
      }
      .seat.empty {
        opacity: 0.5;
        border-left-color: rgba(255, 255, 255, 0.3);
        border-style: dashed;
        font-weight: 800;
      }
      .pbar {
        flex: 1 1 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .pbar > span {
        display: block;
        height: 100%;
        background: var(--money);
      }
      .seat.warn .pbar > span {
        background: var(--sun);
      }
      .seat.bad .pbar > span {
        background: #ff4a3c;
      }
      .spare {
        font-size: 0.7em;
        font-weight: 900;
        opacity: 0.9;
      }
      .tagx {
        font-size: 0.62em;
        font-weight: 900;
        background: var(--sun);
        color: var(--night);
        padding: 3px 9px;
        border-radius: 999px;
      }
      .tagx.red {
        background: #e8261b;
        color: #fff;
      }
      @keyframes hurry {
        50% {
          background: rgba(232, 38, 27, 0.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .seat.bad {
          animation: none;
        }
      }
      #cash {
        background: rgba(12, 8, 30, 0.74);
        backdrop-filter: blur(10px);
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-radius: 20px;
        padding: 4px 18px;
      }
      /* ---------- buttons v2 ---------- */
      .opt {
        background: linear-gradient(180deg, #3b2c72, #2a1f56);
        border: 5px solid #5a4b8f;
        box-shadow:
          0 6px 0 #170f33,
          0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .opt.on {
        background: linear-gradient(180deg, #ffe27a, #ffc93f);
        box-shadow:
          0 0 0 7px var(--pink),
          0 6px 0 #b8860b,
          0 0 40px rgba(255, 210, 63, 0.6);
      }
      #bar {
        background: linear-gradient(180deg, rgba(18, 10, 40, 0.9), rgba(10, 6, 24, 0.98));
        backdrop-filter: blur(8px);
      }
      /* ---------- title v2 ---------- */
      #menuTitle {
        position: relative;
        padding-bottom: 22px;
      }
      #menuTitle::after {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 0;
        height: 16px;
        border-radius: 4px;
        background: repeating-conic-gradient(#111 0 25%, #ffd23f 0 50%) 0 0/16px 16px;
        box-shadow: 0 4px 0 #000;
      }
      #menuList .opt {
        background: linear-gradient(180deg, rgba(59, 44, 114, 0.92), rgba(42, 31, 86, 0.92));
        backdrop-filter: blur(6px);
      }
      #menuList .opt.on {
        background: linear-gradient(180deg, #ffe27a, #ffc93f);
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-hidden="true"></canvas>
    <div id="noGL" class="hide">This game needs 3D graphics (WebGL), which this browser has turned off.</div>
    <div id="hud" class="hide">
      <div>
        <div id="mission"><small id="modeName"></small><span id="missionText"></span></div>
        <div id="combo"></div>
      </div>
      <div id="right">
        <div id="cash">$0</div>
        <div id="stars"></div>
        <canvas id="mm" width="360" height="360"></canvas>
      </div>
    </div>
    <div id="banner" aria-hidden="true"><b id="bTitle"></b><span id="bSub"></span></div>
    <div id="focus" class="hide" aria-hidden="true"></div>
    <div id="status" class="hide" role="status">Parked</div>
    <div id="bar" class="hide">
      <div class="hint" id="barHint"></div>
      <div id="opts"></div>
    </div>
    <div id="menu">
      <h1 id="menuTitle">Switch Cab</h1>
      <p id="menuSub"></p>
      <div id="menuList"></div>
      <div class="hint" id="menuHint"></div>
    </div>
    <div id="share" class="hide">
      <b>Share a city (needs a mouse and keyboard)</b
      ><span>Copy this code to share your city, or paste a friend’s code and press Import.</span
      ><textarea id="shareText"></textarea>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <button id="shCopy">Copy code</button><button id="shImport">Import code</button
        ><button id="shClose">Close</button>
      </div>
      <span id="shMsg"></span>
    </div>
    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
    </script>
    <script src="js/input-scanning-voice.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/models.js"></script>
    <script src="js/city.js"></script>
    <script src="js/imported-models.js"></script>
    <script src="js/visual-effects.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/turns-carpool-police.js"></script>
    <script src="js/traffic.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/shift.js"></script>
    <script src="js/city-editor-and-camera.js"></script>
  </body>
</html>
