name: Capture README screenshots
on:
  push:
    branches: [docs/switch-cab-v1]
    paths: ['.github/workflows/readme-screenshots.yml', 'tools/capture-readme.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    if: github.ref == 'refs/heads/docs/switch-cab-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install chromium --only-shell
          node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})' || npx playwright install-deps chromium
      - name: Capture actual game
        run: |
          python3 -m http.server 8000 > /tmp/switchcab-http.log 2>&1 &
          node tools/capture-readme.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-cab-readme-screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
      - name: Commit screenshots to documentation branch
        run: |
          test "$(find docs/screenshots -name '*.png' | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Capture Switch Cab v1.0 gameplay screenshots"
            git push origin HEAD:docs/switch-cab-v1
          fi
