name: Test and publish Switch Cab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switchcab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: |
          for test in tests/{switch-input,speech-wait,practice,visual-access,navigation,editor,editor-flow,dare,quick-route,advanced-practice}.cjs; do node "$test" || exit 1; done
          for script in js/*.js; do node --check "$script" || exit 1; done
      # Only reuse a successful PR's browser checks when its tested Git tree
      # exactly matches the main commit. Direct pushes, workflow dispatch,
      # missing artifacts, API errors and changed merge trees all test fully.
      - name: Check for already verified merge tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          if ! pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"); then exit 0; fi
          pr=$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")][0].number // empty' <<< "$pulls")
          head=$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")][0].head.sha // empty' <<< "$pulls")
          if [[ -z "$pr" || -z "$head" ]]; then exit 0; fi
          if ! runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs" -f event=pull_request -f head_sha="$head" -f status=success -f per_page=20); then exit 0; fi
          # GitHub may omit pull_requests after merging. Verify the PR identity
          # recorded by the successful workflow instead, as well as its exact tree.
          candidates=$(jq -r --arg head "$head" '[.workflow_runs[] | select(.head_sha == $head and .event == "pull_request" and .conclusion == "success")] | .[].id' <<< "$runs")
          tree=$(git rev-parse 'HEAD^{tree}')
          expected=$(printf '%s\n%s' "$pr" "$head")
          for run in $candidates; do
            dir=$(mktemp -d)
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name verified-tree --dir "$dir" &&
               [[ -f "$dir/verified-pr.txt" && -f "$dir/verified-tree.txt" ]] &&
               [[ "$(cat "$dir/verified-pr.txt")" == "$expected" ]] &&
               [[ "$(cat "$dir/verified-tree.txt")" == "$tree" ]]; then
              echo "Exact tree already passed browser CI in PR #$pr (run $run)."
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf "$dir"
          done
          echo "No matching verified PR artifact; running browser checks."
      - name: Cache Chromium headless shell
        if: steps.reuse.outputs.verified != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: switchcab-playwright-shell-1.51.1-${{ runner.os }}-${{ runner.arch }}
      - name: Browser dependencies
        if: steps.reuse.outputs.verified != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install chromium --only-shell
          node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})' || npx playwright install-deps chromium
      - name: Browser smoke test
        if: steps.reuse.outputs.verified != 'true'
        run: |
          python3 -m http.server 8000 > /tmp/switchcab-http.log 2>&1 &
          node tests/browser-smoke.cjs
      - name: Record verified PR tree
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/verified-tree.txt"
          printf '%s\n%s\n' "$PR_NUMBER" "$PR_HEAD" > "$RUNNER_TEMP/verified-pr.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: verified-tree
          path: |
            ${{ runner.temp }}/verified-tree.txt
            ${{ runner.temp }}/verified-pr.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.reuse.outputs.verified != 'true'
        with:
          name: browser-smoke
          path: browser-smoke.png
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r index.html js assets CREDITS.md LICENSE.txt _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
